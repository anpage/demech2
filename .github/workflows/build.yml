name: Build

on: [push, pull_request]

jobs:
  targets:
    name: reccmp targets
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.list.outputs.entries }}
      matrix: ${{ steps.list.outputs.matrix }}
      all_matrix: ${{ steps.list.outputs.all_matrix }}
    steps:
      - name: List reccmp targets
        id: list
        run: |
          # One line per reccmp target: "TARGET:--total", where --total is the
          # game-code function count from the Ghidra original: everything
          # below the import thunks (MW2SHELL, 0x100492a2) or the CRT (MW2,
          # 0x10080490). Progress is game code only: reccmp runs with --nolib,
          # which drops the LIBRARY entries from both sides of the ratio.
          # --total is only a floor: reccmp uses whichever is larger, the
          # annotated function count or --total. Every per-target step below
          # is driven from this list. It holds the public targets only: the
          # retail ones (NETMECHW, MECH2), whose originals aren't public, are
          # listed in verify-retail.yml, the workflow that runs after this one.
          entries="MW2SHELL:770 MW2:1537"
          # The retail targets, for the jobs that need no original binary
          # (decomplint), in reccmp-project.yml's order after the public ones.
          retail="NETMECHW MECH2"

          {
            echo "entries=$entries"
            # -c: $GITHUB_OUTPUT parsing requires one key=value pair per line,
            # so the JSON array must stay on a single line.
            echo "matrix=$(printf '%s\n' $entries | cut -d: -f1 | jq -cRn '[inputs]')"
            echo "all_matrix=$(printf '%s\n' $(printf '%s\n' $entries | cut -d: -f1) $retail | jq -cRn '[inputs]')"
          } >> "$GITHUB_OUTPUT"

  fetch-deps:
    name: Download original binaries
    uses: ./.github/workflows/mw2bin.yml

  build-current-toolchain:
    name: Current MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja

      - name: Setup vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - name: Build
        run: |
          # Pin both compilers to cl: with only CXX pinned, CMake picks clang
          # from PATH (the LLVM install below) for C, and CMake >= 4.4 refuses
          # to configure a Clang/MSVC mix. clang-tidy still runs via
          # ENABLE_CLANG_TIDY.
          cmake -S . -B build -GNinja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Debug `
            -DENABLE_CLANG_TIDY=ON `
            -Werror=author
          cmake --build build -- -k0

      - name: Test
        run: |
          # The portable C that replaces the hand-written assembly: against the
          # golden vectors, and against the assembly itself as this compiler's
          # inline assembler builds it (tests/asmequiv)
          ctest --test-dir build --output-on-failure

  build:
    name: "MSVC 4.1"
    runs-on: windows-latest

    steps:
      - name: "Checkout demech2 sources"
        uses: actions/checkout@v6

      - name: "Checkout MSVC 4.1 toolchain"
        uses: actions/checkout@v6
        with:
          repository: madebr/msvc410
          path: msvc410

      - name: "Checkout MASM 6.11"
        uses: actions/checkout@v6
        with:
          repository: shengyanli1982/MASM611
          ref: 36b14330ade0f3347d7bc7ba373304f279c81221
          path: masm611

      - name: "Checkout MSVC 2.2 toolchain"
        uses: actions/checkout@v6
        with:
          # MECH2.EXE and NETMECHW.DLL were built with VC++ 2.2: CMake builds
          # them with this toolchain in a nested build (build/vc22).
          repository: archaic-msvc/msvc220
          ref: c0fff2aecaa88576c685de79173be4ead4dbe42c
          path: msvc220

      - name: "Setup cmake"
        uses: jwlawson/actions-setup-cmake@v2
        with:
          # 3.26.6 is the version known to drive the VC++ 4.1 NMake generator
          # (the Docker image uses the same version).
          cmake-version: 3.26.6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install capstone
        run: |
          # tools/asmblocks.py lists the reference's basic blocks for the
          # asmequiv coverage test
          pip install capstone

      - name: Build
        shell: cmd
        run: |
          rem The shell's icon 103 is deliberately left out of CI builds: CMake
          rem takes it from the original MW2SHELL.DLL when that file is present
          rem and otherwise builds without it. The icon is a resource, so
          rem nothing reccmp compares is affected.
          rem ML.EXE is passed explicitly rather than put on PATH: MASM's BIN
          rem also holds a 16-bit LINK, LIB and NMAKE.
          call .\msvc410\bin\VCVARS32.BAT x86
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "NMake Makefiles" "-DCMAKE_ASM_MASM_COMPILER=%CD%\masm611\BIN\ML.EXE" "-DDEMECH2_MSVC22_ROOT:PATH=%CD%\msvc220"
          cmake --build build

      - name: Test
        shell: cmd
        run: |
          rem The portable C that replaces the hand-written assembly, against the
          rem matched assembly; also checks that tests/asmequiv/golden.txt is what
          rem this reference writes, and that the cases reach every basic block of
          rem the reference.
          ctest --test-dir build --output-on-failure

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: Win32
          path: |
            build/*.dll
            build/*.pdb
            build/*.map
            build/vc22/NETMECHW.dll
            build/vc22/NETMECHW.pdb
            build/vc22/NETMECHW.map
            build/vc22/MECH2.exe
            build/vc22/MECH2.pdb

  portable:
    name: Portable C (${{ matrix.cc }}, UBSan + ASan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          # The portable C that replaces the hand-written assembly, built for
          # x86-64 on its own (tests/asmequiv as a standalone project) and
          # checked against the golden vectors the VC++ 4.1 reference writes
          cmake -S tests/asmequiv -B build -DCMAKE_BUILD_TYPE=Debug -DASMEQUIV_SANITIZE=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  verify:
    name: Verify decomp
    needs: [build, fetch-deps, targets]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      TARGET_ENTRIES: ${{ needs.targets.outputs.entries }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: Win32
          path: build

      - name: Restore cached original binaries
        id: cache-original-binaries
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: mw2bin
          key: mw2bin

      - name: Install python packages
        shell: bash
        run: |
          pip install -r tools/requirements.txt

      - name: Detect binaries
        id: detection
        run: |
          reccmp-project detect --what original   --search-path mw2bin
          reccmp-project detect --what recompiled --search-path build

      - name: Summarize Accuracy
        shell: bash
        run: |
          for entry in $TARGET_ENTRIES; do
            target="${entry%%:*}"
            total="${entry##*:}"
            reccmp-reccmp -S "${target}PROGRESS.SVG" --target "$target" --nolib --total "$total" --json "${target}PROGRESS.json" --html "${target}PROGRESS.HTML"
          done

      - name: Compare Accuracy With Current Main
        shell: bash
        env:
          RELEASE_URL: https://github.com/anpage/demech2/releases/download/continuous
        run: |
          for entry in $TARGET_ENTRIES; do
            target="${entry%%:*}"
            total="${entry##*:}"

            curl -fLSs -o "${target}PROGRESS-old.json" "$RELEASE_URL/${target}PROGRESS.json" || echo "" >"${target}PROGRESS-old.json"

            (reccmp-reccmp --target "$target" --nolib --total "$total" --diff "${target}PROGRESS-old.json" || echo "Current main not found")>"${target}-diff.txt"

            cat "${target}-diff.txt"
          done

      - name: Check Vtables
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        run: |
          for entry in $TARGET_ENTRIES; do
            reccmp-vtable --target "${entry%%:*}"
          done

      - name: Check Variables
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        run: |
          for entry in $TARGET_ENTRIES; do
            reccmp-datacmp --target "${entry%%:*}"
          done

      - name: Check Folding
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        run: |
          for entry in $TARGET_ENTRIES; do
            python tools/check_folded.py --target "${entry%%:*}"
          done

      - name: Check Block Layout
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        run: |
          # The original's fread/fwrite/memcpy/memset... of a global must fit in
          # the recompiled object at that address, and no global may be declared
          # larger than the original's room for it (tools/check_block_layout.py).
          for entry in $TARGET_ENTRIES; do
            python tools/check_block_layout.py --target "${entry%%:*}"
          done

      - name: Check Units
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        run: |
          # Each function and global must sit in the source file the original's
          # object layout implies; known exceptions are listed in
          # tools/check_units_expected.txt (tools/check_units.py).
          for entry in $TARGET_ENTRIES; do
            python tools/check_units.py --target "${entry%%:*}"
          done

      - name: "Create comment on PR"
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section() {
            echo "## $1"
            echo '```'
            if [ -f "$2" ]; then
              sed -i -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$2"
              python -c "print(open('$2').read().strip())";
            else
              echo '(no diff available)';
            fi
            echo '```'
          }

          {
            echo '# reccmp report'
            for entry in $TARGET_ENTRIES; do
              target="${entry%%:*}"
              section "$target ($target.DLL)" "$target-diff.txt"
            done
          } >reccmp-pr-message.txt

          echo "${{ github.event.number }}" >pr-number.txt

          cat reccmp-pr-message.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: Accuracy Report
          path: |
            *PROGRESS*

      - name: Upload PR comment payload
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/upload-artifact@main
        with:
          name: reccmp-pr-comment
          path: |
            reccmp-pr-message.txt
            pr-number.txt

  upload:
    name: Upload artifacts
    needs: [verify, targets]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'anpage/demech2' }}
    permissions:
      contents: write
    env:
      TARGET_ENTRIES: ${{ needs.targets.outputs.entries }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Win32
          path: build

      - uses: actions/download-artifact@v8
        with:
          name: Accuracy Report

      - name: Upload Continuous Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release distributes the built binaries and progress reports; the
          # verify job's compare-with-main step also downloads
          # ${target}PROGRESS.json from here. The README does not embed the
          # SVGs from release assets (GitHub serves them with a content type
          # browsers refuse for SVG in <img> tags): verify-retail.yml's
          # publish job deploys them to GitHub Pages, together with the
          # retail targets' reports, once this workflow has finished.
          gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create continuous --repo "$GITHUB_REPOSITORY" --title "Continuous build" --prerelease --target "$GITHUB_SHA"

          files=()
          for entry in $TARGET_ENTRIES; do
            target="${entry%%:*}"
            files+=(
              "build/${target}.dll"
              "build/${target}.pdb"
              "build/${target}.map"
              "${target}PROGRESS.SVG"
              "${target}PROGRESS.HTML"
              "${target}PROGRESS.json"
            )
          done

          # The retail targets' recompiled binaries, from the nested VC++ 2.2
          # build. Their progress reports are published by verify-retail.yml,
          # which needs the originals; the binaries themselves are built from
          # the sources alone. MECH2 has no map file: /MAP would turn its
          # incremental link off.
          files+=(
            build/vc22/NETMECHW.dll
            build/vc22/NETMECHW.pdb
            build/vc22/NETMECHW.map
            build/vc22/MECH2.exe
            build/vc22/MECH2.pdb
          )

          gh release upload continuous "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

          # The release shows the commit its tag points to, which gh release
          # create only sets when it creates the release: move the tag to the
          # commit these files were built from. A tag pushed with the
          # workflow's token triggers no workflow run.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null

  decomplint:
    name: ${{ matrix.target }} annotations
    runs-on: ubuntu-latest
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        # Every target, retail ones included: the annotations are linted
        # without the original binaries.
        target: ${{ fromJSON(needs.targets.outputs.all_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python libraries
        id: install
        run: |
          pip install -r tools/requirements.txt

      - name: Run decomplint
        if: ${{ steps.install.conclusion == 'success' && always() }}
        run: |
          reccmp-decomplint ${{ matrix.target }} --module ${{ matrix.target }} --warnfail

      - name: Check address padding
        if: ${{ steps.install.conclusion == 'success' && always() }}
        run: |
          python tools/reccmp_addr_padding.py

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: |
          find MECH2 NETMECHW MW2SHELL MW2 tests tools \( -iname '*.h' -o -iname '*.c' -o -iname '*.cpp' \) -print0 | xargs -0 -r \
          pipx run "clang-format>=22,<23" \
            --style=file \
            -i
          git diff --color --exit-code

  naming:
    name: Naming conventions
    runs-on: ubuntu-latest
    needs: [targets]
    env:
      TARGET_ENTRIES: ${{ needs.targets.outputs.entries }}
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python libraries
        run: |
          pip install clang==21.* pyyaml

      - name: Run ncc
        run: |
          # ncc validates the whole source tree: the retail targets too
          # (NETMECHW, MECH2), which aren't in TARGET_ENTRIES (their originals
          # aren't public).
          includes=(util NETMECHW/include NETMECHW MECH2/include MECH2)
          paths=(NETMECHW MECH2)
          for entry in $TARGET_ENTRIES; do
            target="${entry%%:*}"
            if [ -d "$target/include" ]; then
              includes+=("$target/include")
            fi
            includes+=("$target")
            paths+=("$target")
          done

          python3 tools/ncc/ncc.py \
            --clang-lib ${{ env.LLVM_PATH }}/lib/libclang.so \
            --recurse \
            --style tools/ncc/ncc.style \
            --skip tools/ncc/skip.yml \
            --definition DEFINE_GUID PASCAL WINAPI FAR BOOL=int CALLBACK HWND__=HWND AILIMPORT AILCALL AILCALLBACK \
            --include "${includes[@]}" \
            --path "${paths[@]}"

  block-sizes:
    name: Block sizes
    runs-on: ubuntu-latest
    needs: [targets]
    env:
      TARGET_ENTRIES: ${{ needs.targets.outputs.entries }}
    steps:
      - uses: actions/checkout@v6

      # The sources are parsed against the headers they are built with.
      - name: Checkout MSVC 4.1 toolchain
        uses: actions/checkout@v6
        with:
          repository: madebr/msvc410
          path: msvc410

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python libraries
        run: |
          pip install clang==21.*

      - name: Check block operations against their objects
        run: |
          # fread/fwrite/memcpy/memset... of a constant size must fit in the
          # object they are given: a run of globals the original handles as
          # one block has to be one struct here (tools/check_block_sizes.py).
          # The retail targets (NETMECHW, MECH2) aren't in TARGET_ENTRIES.
          paths=(NETMECHW MECH2)
          for entry in $TARGET_ENTRIES; do
            paths+=("${entry%%:*}")
          done

          python3 tools/check_block_sizes.py \
            --clang-lib ${{ env.LLVM_PATH }}/lib/libclang.so \
            --msvc-include msvc410/include \
            --verbose \
            "${paths[@]}"
