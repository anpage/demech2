name: Verify retail targets and comment

# Runs after the Build workflow finishes. Triggered via workflow_run so it
# executes in the base-repo context, with a writable token (which lets it
# comment on pull requests opened from forks) and with the repository's
# secrets: the deploy key that checks out the retail targets' originals
# (NETMECHW.DLL, MECH2.EXE, and the Matrox and 3Dfx editions' MW2_MATROX.DLL
# and MW2_3DFX.DLL), which aren't freely downloadable the way mw2bin.yml
# fetches the 1.1 patch.
#
# Only code from the base branch runs here: this workflow, the tools/ scripts
# and reccmp. The PR's checkout is data (its annotated sources and
# reccmp-project.yml), compared with the binaries the Build run compiled from
# it. The originals are fetched fresh each run and never cached or uploaded.
#
# The public targets (MW2SHELL, MW2) are verified by the Build workflow itself
# (its verify job), which uploads its comment payload for the comment job here.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

env:
  # One line per retail target: "TARGET:FILE:--total", where --total is the
  # game-code function count from the Ghidra original, as in the Build
  # workflow's targets job (NETMECHW: the 244 functions before the DPLAY
  # import thunks at 0x10013b70; MECH2: the 21 functions before its import
  # thunks at 0x004022be; MW2MATROX: the 1597 functions before its CRT at
  # 0x10092d30; MW23DFX: the 1574 functions before the import thunks that
  # precede Texus at 0x100680b2, as tools/edition.py's functions command
  # counts them by tracing the code; Ghidra finds 1313). The list lives
  # here rather than in Build's targets job: a workflow_run job can't read the
  # Build run's outputs.
  RETAIL_ENTRIES: "NETMECHW:NETMECHW.DLL:244 MECH2:MECH2.EXE:21 MW2MATROX:MW2_MATROX.DLL:1597 MW23DFX:MW2_3DFX.DLL:1574"
  # The targets whose block layout check is reported but doesn't fail the
  # job yet: reccmp can't resolve some of the element types in the Matrox
  # edition's LINK 3.00 PDB, and falls back on the gap to the next symbol.
  # Their datacmp issues and unit findings fail the job like any target's.
  REPORT_ONLY: "MW2MATROX"

jobs:
  retail:
    name: Verify retail targets
    # Only the project's own repository holds the deploy key. Forks of the
    # project skip this job; their PR comments carry the public targets only.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.repository == 'anpage/demech2' }}
    # windows-latest like Build's verify job: reccmp needs cvdump.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The default ref of a workflow_run job is the default branch: this
      # checkout supplies the trusted tools.
      - name: Checkout the base branch (tools)
        uses: actions/checkout@v6

      # The sources reccmp reads the annotations from. For a pull_request run
      # this is the PR's head commit, while Build compiled the merge commit:
      # the two only differ when main moved under an unrebased PR.
      - name: Checkout the verified commit (data)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          persist-credentials: false

      - name: Checkout the retail originals
        uses: actions/checkout@v6
        with:
          repository: anpage/demech2-originals
          path: retailbin
          ssh-key: ${{ secrets.ORIGINALS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify the originals
        shell: bash
        working-directory: retailbin
        run: |
          # The hashes reccmp-project.yml carries.
          sha256sum --check --strict <<'SUMS'
          3f4d1508238d847213127e46623a85b249985686d6053a3d9e1c6deea87c0095 *NETMECHW.DLL
          064a9f1f45cfd18f0bef1dea9711b7fd582755cfbb8a8e9694f8cef2e5c3690c *MECH2.EXE
          444e19ad054cbe852ec8a54ddb8a6ffa019de2ce7ab97571fea62f9666982220 *MW2_MATROX.DLL
          e15b8ca2013a365df11723aa97f9e7ea2914e1139090800f9b452fb7ea08282f *MW2_3DFX.DLL
          SUMS

      - name: Download the Build run's binaries
        uses: actions/download-artifact@v8
        with:
          name: Win32
          path: pr/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The objects the Build run's certify job compiled from the PR's sources and witness
      # records: data, like the binaries, compared here with the originals.
      - name: Download the Build run's certify objects
        uses: actions/download-artifact@v8
        with:
          name: Certify objects
          path: certify
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python packages
        shell: bash
        run: |
          pip install -r tools/requirements.txt

      # reccmp-project writes reccmp-user.yml next to the PR's
      # reccmp-project.yml and reccmp-build.yml into the current directory,
      # and every reccmp command below runs from pr/ to find them. The public
      # targets' originals aren't here, so detect warns about them; only the
      # retail targets are compared. The artifact keeps the nested builds'
      # layout: NETMECHW.DLL, MECH2.EXE and MW2_3DFX.DLL sit in build/vc22
      # (VC++ 2.2), MW2_MATROX.DLL in build/vc40 (VC++ 4.0).
      - name: Detect binaries
        id: detection
        shell: bash
        working-directory: pr
        run: |
          reccmp-project detect --what original   --search-path ../retailbin
          reccmp-project detect --what recompiled --search-path build build/vc22 build/vc40

      - name: Summarize Accuracy
        shell: bash
        working-directory: pr
        run: |
          for entry in $RETAIL_ENTRIES; do
            IFS=: read -r target file total <<<"$entry"
            reccmp-reccmp -S "${target}PROGRESS.SVG" --target "$target" --nolib --total "$total" --json "${target}PROGRESS.json" --html "${target}PROGRESS.HTML"
          done

      - name: Compare Accuracy With Current Main
        shell: bash
        working-directory: pr
        env:
          RELEASE_URL: https://github.com/anpage/demech2/releases/download/continuous
        run: |
          for entry in $RETAIL_ENTRIES; do
            IFS=: read -r target file total <<<"$entry"

            curl -fLSs -o "${target}PROGRESS-old.json" "$RELEASE_URL/${target}PROGRESS.json" || echo "" >"${target}PROGRESS-old.json"

            (reccmp-reccmp --target "$target" --nolib --total "$total" --diff "${target}PROGRESS-old.json" || echo "Current main not found")>"${target}-diff.txt"

            cat "${target}-diff.txt"
          done

      - name: Check Vtables
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          for entry in $RETAIL_ENTRIES; do
            reccmp-vtable --target "${entry%%:*}"
          done

      - name: Check Variables
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          for entry in $RETAIL_ENTRIES; do
            target="${entry%%:*}"
            reccmp-datacmp --target "$target"
          done

      - name: Check Folding
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          for entry in $RETAIL_ENTRIES; do
            python ../tools/check_folded.py --target "${entry%%:*}"
          done

      - name: Check Block Layout
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          # The original's fread/fwrite/memcpy/memset... of a global must fit in
          # the recompiled object at that address, and no global may be declared
          # larger than the original's room for it (tools/check_block_layout.py).
          for entry in $RETAIL_ENTRIES; do
            target="${entry%%:*}"
            python ../tools/check_block_layout.py --target "$target" || [[ " $REPORT_ONLY " == *" $target "* ]]
          done

      - name: Check Units
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          # Each function and global must sit in the source file the original's
          # object layout implies; known exceptions are listed in
          # tools/check_units_expected.txt (tools/check_units.py). Not for
          # MECH2: the nested build writes no map file for it (/MAP would turn
          # its incremental link off), and the tool doesn't know an incremental
          # link's layout. Not for MW23DFX yet: its units are only roughly in the
          # 3Dfx edition's order, and the Matrox edition's fragments (code moved
          # between objects) don't match its layout. The known findings are
          # data: they come from the PR's checkout, like the sources, so a PR
          # can list the ones it adds.
          for entry in $RETAIL_ENTRIES; do
            target="${entry%%:*}"
            if [ "$target" = MECH2 ] || [ "$target" = MW23DFX ]; then
              continue
            fi
            python ../tools/check_units.py --target "$target" --expected tools/check_units_expected.txt
          done

      - name: Certify
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        env:
          RELEASE_URL: https://github.com/anpage/demech2/releases/download/continuous
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # As the Build workflow's Certify step: every function's state, and the per-function
          # gate against main's, with the exceptions the PR's description lists ("Gate
          # exception: <TARGET> <function> <reason>"). The base branch's certify.py reads the
          # PR's annotations and records (--tree .) and the Build run's objects.
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body >gate-exceptions.txt || : >gate-exceptions.txt
          else
            : >gate-exceptions.txt
          fi
          status=0
          for entry in $RETAIL_ENTRIES; do
            IFS=: read -r target file total <<<"$entry"
            python ../tools/certify.py --tree . --target "$target" --objects "../certify/$target" --original "../retailbin/$file" --json "${target}STATES.json" --markdown "${target}STATES.md" >"${target}-certify.txt" 2>&1 || status=1
            if curl -fLSs -o "${target}STATES-old.json" "$RELEASE_URL/${target}STATES.json"; then
              python ../tools/certify.py --gate "${target}STATES-old.json" "${target}STATES.json" --exceptions gate-exceptions.txt >>"${target}-certify.txt" 2>&1 || status=1
            else
              echo "(main has no states yet: no gate)" >>"${target}-certify.txt"
            fi
            python ../tools/audit.py --tree . --target "$target" --objects "../certify/$target" --original "../retailbin/$file" --check --json "${target}AUDIT.json" >>"${target}-certify.txt" 2>&1 || status=1
            cat "${target}-certify.txt"
          done
          echo "$status" >../certify-status.txt

      - name: Check Assembly
        if: ${{ steps.detection.conclusion == 'success' && always() }}
        shell: bash
        working-directory: pr
        run: |
          # The fingerprints of tools/asm_allowlist.txt for the functions only the retail
          # originals annotate (tools/check_asm.py; the Build workflow checks the public ones).
          python ../tools/check_asm.py --tree . --verify --targets NETMECHW MECH2 MW2MATROX

      - name: Create the retail sections of the PR comment
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        shell: bash
        working-directory: pr
        run: |
          section() {
            echo "## $1"
            echo '```'
            if [ -f "$2" ]; then
              sed -i -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$2"
              python -c "print(open('$2').read().strip())";
            else
              echo '(no diff available)';
            fi
            echo '```'
          }

          {
            for entry in $RETAIL_ENTRIES; do
              IFS=: read -r target file total <<<"$entry"
              section "$target ($file)" "$target-diff.txt"
              section "$target: certified" "$target-certify.txt"
            done
          } >../reccmp-retail-message.txt

          cat ../reccmp-retail-message.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: Retail Accuracy Report
          path: |
            pr/*PROGRESS*
            pr/*STATES.json
            pr/*STATES.md
            pr/*AUDIT.json

      - name: Upload PR comment payload
        if: ${{ github.event.workflow_run.event == 'pull_request' && always() }}
        uses: actions/upload-artifact@main
        with:
          name: reccmp-retail-comment
          path: |
            reccmp-retail-message.txt

      - name: Fail on certify
        if: ${{ always() }}
        shell: bash
        run: |
          # The Certify step's result: a record failure or a function no longer proven.
          test "$(cat certify-status.txt 2>/dev/null || echo 1)" = 0

  comment:
    name: Comment reccmp report
    needs: [retail]
    # always(): the comment is posted whether the retail job ran, failed or
    # was skipped (a fork of the project).
    if: ${{ always() && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR comment payload
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: reccmp-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download retail PR comment payload
        id: download-retail
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: reccmp-retail-comment
          path: retail

      - name: Post comment
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RETAIL_RESULT: ${{ needs.retail.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f retail/reccmp-retail-message.txt ]; then
            cat retail/reccmp-retail-message.txt >>reccmp-pr-message.txt
          elif [ "$RETAIL_RESULT" != skipped ]; then
            echo "" >>reccmp-pr-message.txt
            echo "Retail targets: verification $RETAIL_RESULT, see $RUN_URL" >>reccmp-pr-message.txt
          fi

          gh pr comment "$(cat pr-number.txt)" \
            --repo "${{ github.repository }}" \
            --create-if-none \
            --edit-last \
            --body-file reccmp-pr-message.txt

  publish:
    name: Publish progress
    needs: [retail]
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.repository == 'anpage/demech2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      # The Build workflow's upload job has already published every target's
      # binaries and the public targets' progress reports to the continuous
      # release.
      - name: Download the public progress reports
        uses: actions/download-artifact@v8
        with:
          name: Accuracy Report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the retail progress reports
        uses: actions/download-artifact@v8
        with:
          name: Retail Accuracy Report

      - name: Upload Continuous Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The retail job's compare-with-main step downloads
          # ${target}PROGRESS.json from here. The recompiled retail binaries
          # are uploaded by the Build workflow's upload job, with the public
          # DLLs.
          files=()
          for entry in $RETAIL_ENTRIES; do
            target="${entry%%:*}"
            files+=(
              "${target}PROGRESS.SVG"
              "${target}PROGRESS.HTML"
              "${target}PROGRESS.json"
              "${target}STATES.json"
              "${target}STATES.md"
              "${target}AUDIT.json"
            )
          done

          gh release upload continuous "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # GitHub Pages serves the progress reports the README embeds (GitHub
      # serves release assets with a content type browsers refuse for SVG in
      # <img> tags). A deployment replaces the whole site, so the one
      # deployment publishes the public and the retail targets together.
      - name: Prepare Pages
        run: |
          mkdir -p progress
          cp ./*PROGRESS.SVG ./*PROGRESS.HTML ./*STATES.md progress/
          ls progress

      - uses: actions/upload-pages-artifact@v3
        with:
          path: progress/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  sweep:
    name: Witness sweep
    # On pushes to main, after the Build run: the witness search (tools/witness.py) runs again
    # over every unit of every target, at up to 24 symbols of padding. It takes tens of minutes,
    # so PRs don't run it: a PR's certify step only replays the records. The sweep shows what
    # the records miss (witnesses found that aren't recorded, records the search no longer
    # finds) as a patch to tools/witnesses/, and publishes each target's search results.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.repository == 'anpage/demech2' }}
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history: the corpus check compiles past revisions (git archive).
          fetch-depth: 0

      - name: "Setup toolchains"
        uses: ./.github/actions/setup-msvc41

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python packages
        shell: bash
        run: |
          pip install -r tools/requirements.txt

      - name: Restore cached original binaries
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: mw2bin
          key: mw2bin

      - name: Checkout the retail originals
        uses: actions/checkout@v6
        with:
          repository: anpage/demech2-originals
          path: retailbin
          ssh-key: ${{ secrets.ORIGINALS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure
        shell: cmd
        run: |
          call .\msvc410\bin\VCVARS32.BAT x86
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "NMake Makefiles" "-DCMAKE_ASM_MASM_COMPILER=%CD%\masm611\BIN\ML.EXE" "-DDEMECH2_MSVC22_ROOT:PATH=%CD%\msvc220" "-DDEMECH2_MSVC40_ROOT:PATH=%CD%\msvc400"
          cmake --build build --target vc22-configure vc40-configure

      - name: Point reccmp-user.yml at the originals
        shell: bash
        run: |
          # The corpus check below reads the originals' paths from it.
          {
            echo "targets:"
            echo "  MW2SHELL:"; echo "    path: mw2bin/MW2SHELL.DLL"
            echo "  MW2:"; echo "    path: mw2bin/MW2.DLL"
            for e in $RETAIL_ENTRIES; do IFS=: read -r t f n <<<"$e"; echo "  $t:"; echo "    path: retailbin/$f"; done
          } >reccmp-user.yml

      - name: Search
        shell: bash
        run: |
          for entry in MW2SHELL:mw2bin/MW2SHELL.DLL MW2:mw2bin/MW2.DLL $(for e in $RETAIL_ENTRIES; do IFS=: read -r t f n <<<"$e"; echo "$t:retailbin/$f"; done); do
            target="${entry%%:*}"
            original="${entry#*:}"
            start=$(date +%s)
            python tools/witness.py --target "$target" --build build --original "$original" --pads 24 --write --json "${target}SWEEP.json" | tee "${target}SWEEP.txt"
            echo "$target: $(( $(date +%s) - start )) s"
          done
          git diff -- tools/witnesses >witness-sweep.patch
          git diff --stat -- tools/witnesses

      - name: Check the audit's corpus
        shell: bash
        run: |
          # The real differences that once passed for entropy (tools/audit_corpus.txt): each
          # revision compiled again, and the classifier must still call each unexplained.
          python tools/audit.py --corpus --build build

      - name: Upload the results
        uses: actions/upload-artifact@main
        with:
          name: Witness sweep
          path: |
            *SWEEP.json
            *SWEEP.txt
            witness-sweep.patch

      - name: Publish the results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload continuous ./*SWEEP.json witness-sweep.patch --clobber --repo "$GITHUB_REPOSITORY"
