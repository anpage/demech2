# The project's targets: the one place a target is declared.
#
# docs/TARGETS.md and the README's status table are generated from this file
# (python tools/targets.py --doc), the tools read it (tools/targets.py's load(): TOML, so that no
# tool needs more than Python's standard library for it), and CI checks that the generated
# documents, reccmp-project.yml and the workflows' target lists agree with it
# (python tools/targets.py --check).
#
# The order of the entries is the order of a shared function's annotations.
#
# Each entry stands on its own: no field's text refers to another entry ("the same patch", "built
# like MW2"), so entries can be read, reordered, added and removed one at a time.
#
#   binary       the original's file name, as the project names it
#   component    launcher, shell or simulator
#   edition      which release's build of that component
#   short        the edition's name in the tools' tables and prose (abbr: in narrow column heads)
#   what         one line for the tables
#   about        a paragraph for docs/TARGETS.md (Markdown)
#   sha256, size the original this project targets
#   linked       the day it was linked: its PE header's timestamp, in UTC (a disc's file date is
#                local time, and can be the day before)
#   availability public (CI downloads it) or retail (CI reads it from a private repository)
#   origin       where the original comes from (Markdown)
#   sources      the directories its annotations are in (reccmp's source-root, decomplint's paths)
#   compiler     the Visual C++ release that built the original
#   language, cl, crt, link   the build configuration
#   built-in     the subdirectory of the build tree its binary is written to ("" for the root)
#   output       the rebuilt binary's file name
#   total        the game-code function count (reccmp's --total)
#   game-code    where the game code ends and how the total was counted
#   macros       the identity macros the build defines for it
#   covered-by   (optimized editions) the /Od targets whose proof of the same source covers a
#                function (tools/coverage.py)

[targets.MW2SHELL]
binary = 'MW2SHELL.DLL'
component = 'shell'
edition = '1.1 patch'
short = '1.1'
what = 'Shell: FMV, menus, settings, metagame'
about = '''
MechWarrior 2's shell (FMV, menus, settings, metagame), from the freely downloadable 1.1 patch,
built with VC++ 4.1 at `/Od`. A mixture of C and C++.'''
sha256 = '1078ccb07fd45388bfd525719a8206ce7a01d6536776d30a5655ccb928900879'
size = 545792
linked = 1996-10-09
availability = 'public'
origin = 'The [1.1 patch](https://archive.org/details/mw2patch)'
sources = ["MW2SHELL", "common"]
compiler = '4.1'
language = 'C++ (C files: no `/GX`)'
cl = '`/Od /Oi /G5 /Ob1 /GX`'
crt = '`/MT` (static)'
link = '`/DLL` (comparison build adds `/DEBUG /OPT:REF /INCREMENTAL:no`)'
built-in = ''
output = 'MW2SHELL.dll'
total = 770
game-code = 'below the import thunks at `0x100492a2`'
macros = []

