[targets.NETMECHW]
binary = 'NETMECHW.DLL'
component = 'shell'
edition = 'retail'
short = 'retail'
what = "NetMech's shell"
about = '''
NetMech's shell (what `MW2SHELL.DLL` is to single-player play, for multiplayer, lobby included:
`MECH2.EXE` calls its `Launcher` export,
then runs `MW2.DLL` with the launch record it fills in), from the retail release, built with VC++
2.2 (`cl` 9.10, `_MSC_VER` 900) at `/Od`. A mixture of C and C++, 244 game-code functions in 42
objects, no hand-written assembly. Every game function is decompiled: the units it shares with
`MW2SHELL.DLL` are per-target copies (`debugout.c`, `mw2prj.c`, `prjfile.c`, `resourcecache.c`,
`resourcefile.c`, `resourcename.c`, and the CD check, which NETMECHW links inside the results
dialog's object, `unk10010460.cpp`), and so are the simulator's data-only `bwdkeywords.c` and
`weapondata.c`. The rest is its own: `Launcher`, the lobby window and the pane switch
(`unk10003660.cpp`), one dialog per pane (connection, sessions, host options, guest lobby, player
slots, briefing, mech selection, launch, results), the DirectPlay session list, threads and
messages, the chat, the player table, the `.MEK` mech files and their network form
(`unk10007c30.c`), and the mission files left for the simulator (`unk1000f0f0.cpp`, `bwdwriter.c`).'''
sha256 = '3f4d1508238d847213127e46623a85b249985686d6053a3d9e1c6deea87c0095'
size = 433152
linked = 1995-12-09
availability = 'retail'
origin = '''
The retail release: the [Windows 95 & MS-DOS + NetMech](http://redump.org/disc/25243/) disc, the
[Pentium Processor Edition](http://redump.org/disc/12864/), the [Microsoft SideWinder
OEM](http://redump.org/disc/24336/) disc and the [SoftKey](http://redump.org/disc/41925/) release'''
sources = ["NETMECHW"]
compiler = '2.2'
language = 'C and C++ (no `/GX`)'
cl = '`/Od /Oi /Z7`'
crt = '`/MT` (static `LIBCMT`)'
link = '`/DLL` (comparison build adds `/DEBUG /OPT:REF /INCREMENTAL:no`)'
built-in = 'vc22'
output = 'NETMECHW.dll'
total = 244
game-code = 'before the DPLAY import thunks at `0x10013b70` (its CRT starts at `0x10013b7c`)'
macros = []

