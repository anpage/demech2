targets:
  MW2SHELL:
    filename: MW2SHELL.DLL
    source-root:
      - MW2SHELL
      - common
    hash:
      sha256: 1078ccb07fd45388bfd525719a8206ce7a01d6536776d30a5655ccb928900879
    data-sources:
      - reccmp/mw2shell-ascii.csv
      - reccmp/mw2shell-vfx.csv
    report:
      icon: assets/dll.png
      # The cockpit controls field tables keep integer indices in ScreenField's pointer members
      # (m_data, m_arg). datacmp reports every such field as a diff even when both sides
      # hold the same value, so the tables are left out. They matched field for field when added.
      ignore-variables:
        - g_cpcBindingsFields
        - g_cpcDevicesFields
        # The mech bay's field tables that keep integers in the same members (mechbay.cpp),
        # generated field for field from the original.
        - g_armorFields
        - g_equipmentFields
        - g_weaponFields
        - g_criticalFields
        # The pilot roster's mission list (rosterscreen.cpp), likewise.
        - g_missionListFields
  MW2:
    filename: MW2.DLL
    source-root:
      - MW2
      - common
    hash:
      sha256: 6212d542f8f915a594b278ab189f20a27e522e7c08ac57ce68bf47f45b17bbb5
    data-sources:
      - reccmp/mw2-ascii.csv
      - reccmp/mw2-vfx.csv
    report:
      icon: assets/dll.png
      # The cockpit layouts keep indices into g_cockpitGauges in their gauge function pointers
      # until LoadCockpitLayout resolves them (targeting.c), which datacmp reports as diffs
      # even when both sides hold the same values. They matched member for member when added.
      ignore-variables:
        - g_smallMapLayout
        - g_largeMapLayout
        - g_satelliteLayout
  MW2MATROX:
    filename: MW2_MATROX.DLL
    source-root:
      - MW2
      - common
    hash:
      sha256: 444e19ad054cbe852ec8a54ddb8a6ffa019de2ce7ab97571fea62f9666982220
    data-sources:
      - reccmp/mw2matrox-vfx.csv
    report:
      icon: assets/dll.png
      # As MW2's.
      ignore-variables:
        - g_smallMapLayout
        - g_largeMapLayout
        - g_satelliteLayout
  NETMECHW:
    filename: NETMECHW.DLL
    source-root:
      - NETMECHW
    hash:
      sha256: 3f4d1508238d847213127e46623a85b249985686d6053a3d9e1c6deea87c0095
    report:
      icon: assets/dll.png
  MECH2:
    filename: MECH2.EXE
    source-root:
      - MECH2
    hash:
      sha256: 064a9f1f45cfd18f0bef1dea9711b7fd582755cfbb8a8e9694f8cef2e5c3690c
    report:
