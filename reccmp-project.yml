targets:
  MW2SHELL:
    filename: MW2SHELL.DLL
    source-root:
      - MW2SHELL
    hash:
      sha256: 1078ccb07fd45388bfd525719a8206ce7a01d6536776d30a5655ccb928900879
    data-sources:
      - reccmp/mw2shell-ascii.csv
    report:
      icon: assets/dll.png
      # The cockpit controls field tables keep integer indices in ScreenField's pointer members
      # (m_data, m_arg). datacmp reports every such field as a diff even when both sides
      # hold the same value, so the tables are left out. They matched field for field when added.
      ignore-variables:
        - g_cpcBindingsFields
        - g_cpcDevicesFields
        # The mech bay's field tables that keep integers in the same members (mechbay.cpp),
        # generated field for field from the original.
        - g_armorFields
        - g_equipmentFields
        - g_weaponFields
        - g_criticalFields
        # The pilot roster's mission list (rosterscreen.cpp), likewise.
        - g_missionListFields
  MW2:
    filename: MW2.DLL
    source-root:
      - MW2
    hash:
      sha256: 6212d542f8f915a594b278ab189f20a27e522e7c08ac57ce68bf47f45b17bbb5
    data-sources:
      - reccmp/mw2-ascii.csv
    report:
      icon: assets/dll.png
      # The cockpit layouts keep indices into g_cockpitGauges in their gauge function pointers
      # until LoadCockpitLayout resolves them (rendertarget.c), which datacmp reports as diffs
      # even when both sides hold the same values. They matched member for member when added.
      ignore-variables:
        - g_unk0x100aaf08
        - g_unk0x100aafb0
        - g_unk0x100ab058
  # NETMECHW: added once a version is chosen
  MECH2:
    filename: MECH2.EXE
    source-root:
      - MECH2
    hash:
      sha256: 064a9f1f45cfd18f0bef1dea9711b7fd582755cfbb8a8e9694f8cef2e5c3690c
    report:
      icon: assets/dll.png
